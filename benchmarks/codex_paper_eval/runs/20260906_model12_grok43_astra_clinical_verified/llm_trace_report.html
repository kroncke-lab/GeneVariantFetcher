opied onto each variant. Do not treat every case in a\ndisease-ascertained cohort as affected without applicable phenotype evidence.\nDo not infer unaffected by subtracting affected from carriers. Do not add\ncurrent-study and cited prior-study cohorts, or overlapping patient lists.\n\nPrefer an explicit per-variant count. If a patient-level table uniquely identifies\neach person, a count may instead be derived by enumerating and deduplicating\nthose exact patient IDs, joining tables only through explicit IDs. In that case\nlabel the basis individual_rows and return all IDs and the verbatim source rows\nsupporting the derivation. Do not manufacture a literal quote containing a sum.\nIf layout/merged cells or IDs make ownership ambiguous, return null and explain.\n\nFor each non-null field provide that field's own evidence: a verbatim contiguous\nquote or exact table header plus row, source locator, count role, basis, and scope.\nThe normal downstream validator may refuse a derivation even if you consider it\nvalid; your job here is an independent reading, with all uncertainty retained.\nDo not seek external sources or use remembered facts about the paper.\n\nReturn JSON only:\n{\"variants\":[{\"variant\":\"paper's variant notation\", \"carriers\":null,\n\"affected\":null,\"unaffected\":null,\n\"carriers_evidence\":{\"quote\":\"exact source span\", \"count_role\":\"per_variant_carriers\", \"basis\":\"explicit|individual_rows|none\", \"scope\":\"current_study|prior_study|unclear\", \"person_ids\":[], \"evidence_locator\":{\"kind\":\"sentence|table_row|patient_rows\", \"section\":\"\", \"table\":\"\", \"column\":\"\", \"row\":\"\"}},\n\"affected_evidence\":{},\"unaffected_evidence\":{},\"uncertainty\":\"\"}],\n\"clinical_count_status\":\"present|not_reported|ambiguous\", \"unresolved_sources\":[]}\n\nUse per_variant_affected and per_variant_unaffected for the respective field's\nrole. Include only the target gene and biological variants actually in the source.\n\n--- ARTICLE SOURCE ---\n# MAIN TEXT\n\n## Screening mutations in myosin binding protein C3 gene in a cohort of patients with Hypertrophic Cardiomyopathy\n\n### Abstract\n\nBackgroundMyBPC3 mutations are amongst the most frequent causes of hypertrophic cardiomyopathy, however, its prevalence varies between populations. They have been associated with mild and late onset disease expression. Our objectives were to establish the prevalence of MyBPC3 mutations and determine their associated clinical characteristics in our patients.MethodsScreening by Single Strand Conformation Polymorphisms (SSCP) and sequencing of the fragments with abnormal motility of the MyBPC3 gene in 130 unrelated consecutive HCM index cases. Genotype-Phenotype correlation studies were done in positive families.Results16 mutations were found in 20 index cases (15%): 5 novel [D75N, V471E, Q327fs, IVS6+5G>A (homozygous), and IVS11-9G>A] and 11 previously described [A216T, R495W, R502Q (2 families), E542Q (3 families), T957S, R1022P (2 families), E1179K, K504del, K600fs, P955fs and IVS29+5G>A]. Maximum wall thickness and age at time of diagnosis were similar to patients with MYH7 mutations [25(7) vs. 27(8), p = 0.16], [46(16) vs. 44(19), p = 0.9].ConclusionsMutations in MyBPC3 are present in 15% of our hypertrophic cardiomyopathy families. Severe hypertrophy and early expression are compatible with the presence of MyBPC3 mutations. The genetic diagnosis not only allows avoiding clinical follow up of non carriers but it opens new possibilities that includes: to take preventive clinical decisions in mutation carriers than have not developed the disease yet, the establishment of genotype-phenotype relationship, and to establish a genetic diagnosis routine in patients with familial HCM.\n\n### Background\n\nHypertrophic Cardiomyopathy (HCM) is an autosomal dominant disorder, characterized by unexplained left ventricular hypertrophy, myocyte hypertrophy and disarray, and interstitial fibrosis [1,2]. It has a frequency of 0.2% in the adult population and is a major cause of sudden cardiac death (SD) in young people (< 35 years old). Ever since the first mutation in the beta myosin heavy chain (MYH7) gene was described as a cause of hypertrophic cardiomyopathy (HCM) in 1990 [3], mutations have been identified in 11 genes that codify cardiac sarcomeric proteins [4-7]. Genes that more frequently show mutations are MYH7 and the cardiac myosin binding protein C (MyBPC3) on chromosomes 14 and 11, respectively. Mutations in MyBPC3 are responsible for 15-20% of cases of familial HCM. Besides, available clinical and familial data are very scarce, making it very difficult to confirm the pathogenicity of the described mutations and to establish reliable correlations between genotype and phenotype.\n\nThree isoforms of myosin binding protein-C are known to exist in adult muscle. The three of them have, 10 globular domains termed C1-C10, 7 of which are immunoglobulin I-like (IgI-like) domains, with the remaining three being fibronectin 3 (Fn3) domains. A conserved linker, termed the S2-binding motif, exists between domains C1 and C2. There is also a proline/alanine-rich extension N-terminal of C1. The cardiac isoform has an additional IgI-like domain at the N-terminus (termed C0), an amino acid sequence LAGGGRRIS within the S2-binding motif, and a 28-amino acid insertion within the C5 domain [8,9]. These domains allow their interaction with other sarcomeric proteins.\n\nThe objectives of this study were first, determining the frequency and type of mutations in the MyBPC3 gene within a range of patients with HMC previously studied for the MYH7 [10] gene; second, describing the clinical features of the carriers; and third, analyzing the correlation between genotype and phenotype in the identified mutations.\n\n### Methods\n\n#### (i) Patients\n\nOne hundred and thirty unrelated consecutive index cases from Complejo Hospitalario Universitario A Coruña, Spain, diagnosed with HCM according to the criteria of the European Society of Cardiology Working Group on Myocardial and Pericardial Diseases [2]. All the patients had been previously studied for mutations in MYH7 [10]. We did a prospective follow-up which included the search for the patient's personal and family history, symptoms, physical exploration, electrocardiogram, echocardiogram, ergometry, Holter, treatments and events. The family members were invited to a check-up that included a clinical study, electrocardiogram, echocardiogram and genetic study. The clinical characteristics of this cohort had been previously described [10]. All patients and family members signed an informed consent agreement and the study was approved by the \"Comité ético de investigación de Galicia\". The study protocol conforms to the ethical guidelines of the 2008 Declaration of Helsinki.\n\n#### (ii) Genetic Study\n\nGenomic DNA was extracted from blood anticoagulated with EDTA with the NUCLEON HT Genomic DNA Extraction Kit (Amersham Biosciences, UK). The primers were designed using reference sequence GenBank:U91629.1[11]. The whole codifying sequence and the flanking intronic regions of the MyBPC3 gene were amplified. Genetic screening was carried out through chain reaction single-strand conformation polymorphism analysis (SSCP) of each fragment using commercial polyacrylamide gels 15/24 (T = 15%, C = 2%-GeneGel-Amersham Biosciences, UK). Each fragment was run to pH 8.3 and pH 9.0. The temperature was optimized for each pH and each fragment. Fragments with abnormal motility were sequenced using automatic sequencer CEQ 8000 Genetic Analysis System (Beckman Coulter, USA). To test the sensitivity of SSCP, the direct sequence analysis of the exon 12 was done for all samples and no false negative results were detected.\n\nA variant was considered a mutation in accordance with three criteria: cosegregation with affected members in the family, absence of the mutation in 200 healthy adult controls, and the conservation of the mutated residue among species.\n\nMoreover, the index cases were studied using Sequenom MassArray™ system where 537 genetic variants of HCM disease genes (TNNT2, TNNI3, TPM1, MYL2, MYL3, ACTC, TTN, MYH6, MYLK2, MYO6, TCAP) were detected by means of MALDI-TOF mass spectrometry after I-PLEX Gold assay (Sequenom Inc.).\n\n#### (iii) In silico tools\n\n##### Splice Site Score Predictions\n\nPrograms Splicesitefinder (SSF), Alternative Splice Site Predictor (ASSP), NetGene2 v2.4, and Human Splicing Finder splice site analysis (HSF) were used to check if the exon changes affected splice-enhancing sequences, and if the intron changes happened in donor or acceptor splicing sites.\n\n##### Predicting Damaging Amino Acid Substitution\n\nThe substitution is predicted to affect protein function with online programs like Polymorphism Phenotyping (Polyphen), PMUT, and Sorting Intolerant From Tolerant (SIFT).\n\n#### (iv) Genotype-Phenotype Correlation\n\nA descriptive study of the phenotypical features of the mutation carriers was undertaken. These characteristics were compared with those of relatives without the mutation in order to study cosegregation and penetrance; taking into account both sex and age. Furthermore, features of the carriers were compared with those in cases with identical mutations previously described in medical literature.\n\n### Results\n\nSixteen mutations in MyBPC3 were identified in 20 of the 130 index cases (15%). Thirteen mutations located in exonic regions were concentrated in 8 motives (Figure 1). Seven of them in, or near, motives implicated in myosin and/or titin binding (C0, C1, S2 binding, C7, C8 and linker C9-C10) and the rest of them in motives in which it is unknown if they establish interactions with other proteins. Three mutations (IVS6+5G>A, IVS11-9G>A and IVS29+5G>A) were located in flanking intronic regions and according to the bioinformatics can affect aberrant transcriptions.\n\nFive of the identified mutations were novel whereas the other eleven mutations had been previously described [11-18] (Table 1). All mutations appeared in heterozygousis, except for IVS6+5G>A, which showed up in homozygousis as we have previously reported [19]. None of the patients with mutations in MyBPC3 showed mutations in MYH7.\n\n### Table 1\n\nMutations in MyBPC3 gene.\n\n| A. Missense mutations in the MyBPC3 gene |  |  |  |  |  |  |\n|---|---|---|---|---|---|---|\n| Fam. | Type | Mutation | Exon/Intron | Ref seq 2920822 | Pathogenicity |  |\n| H73 | Missense | D75N* | E2 | g 2374 G>A | likely |  |\n| H42 | Missense | A216T[12] | E5 | g3898G>A | uncertain |  |\n| H279 | Missense | V471E* | E16 | g10774T>A | likely |  |\n| H161 | Missense | R495W[13] | E17 | g10930C>T | likely |  |\n| H614, H147 | Missense | R502Q[11] | E17 | g10952G>A | likely |  |\n| H153, H641, H166 | Missense | E542Q[14] | E17 | g11071G>C | uncertain |  |\n| H120 | Missense | T957S[15] | E27 | g18572C>G | uncertain |  |\n| H49, H18 | Missense | R1022P[16] | E29 | g19966G>C | likely |  |\n| H95 | Missense | E1179K[17] | E32 | g20989G>A | uncertain |  |\n| B. Deletions in the MyBPC3 gene |  |  |  |  |  |  |\n| Fam. | Type | Mutation | Exon/Intron | Ref seq 2920822 | Possible effect |  |\n|  |  |  |  |  | Transcript | Traduction |\n| H13 | Deletion | Q327fs* | E12 | g7364delG | Frameshift | Truncation (X349) |\n| H46 | Deletion | K504del[18] | E17 | g10957-9delAAG | In frame | One lost aa (X1273) |\n| H37 | Deletion | K600fs[18] | E19 | g12413delA | Frameshift | Truncation (X601) |\n| H160 | Deletion | P955fs[11] | E27 | g18566-7delCT | Frameshift | Truncation (X1049) |\n| C. Splice mutations in the MyBPC3 gene |  |  |  |  |  |  |\n| Fam. | Type | Mutation | Exon/Intron | Ref seq 2920822 | Splice site prediction |  |\n| H56 | Splicing | IVS6+5G>A* | I6 | g5261G>A | splice error |  |\n| H110 | Splicing | IVS11-9G>A* | I11 | g7301G>A | splice error |  |\n| H131 | Splicing | IVS29+5G>A# | I29 | g20096G>A | splice error |  |\n\nThree of the sixteen identified mutations were found in more than one family (Table 1). R502Q and R1022P showed up in two families, respectively, and E542Q appeared in three of them.\n\n#### (i) Comparative between the phenotype of individuals with mutation: MyBPC3 vs. MYH7\n\nThere were no significant differences in maximum thickness among index cases with mutations in MyBPC3 (25(7) mm) and MYH7 (27(8) mm), p = 0.16); and age at time of diagnosis was similar (46(16) vs. 44(19) p = 0.9) (Table 2).\n\n### Table 2\n\nPhenotypic characteristics of the index patients.\n\n|  | Without mutation(n = 97) | Mutation MyBPC3(n = 20) | Mutation MYH7(n = 13) | P(MyBPC3 vs MYH7) | P(with vs without mutation) |\n|---|---|---|---|---|---|\n| Age at diagnosis (years) | 53 (16) | 46 (16) | 44 (19) | 0.97 | 0.051 |\n| Age start follow up (years) | 56 (16) | 49(15) | 50 (18) | 0.86 | 0.049 |\n| Males | 68% | 55% | 38% | 0.46 | 0.054 |\n| Family history of HCM | 23% | 30% | 62% | 0.25 | 0.10 |\n| Family history of sudden death | 16% | 15% | 31% | 0.21 | 0.42 |\n| High blood pressure | 43% | 40% | 23% | 1 | 0.42 |\n| NYHA initial III-IV | 10.5% | 10% | 8% | 0.60 | 0.74 |\n| NYHA III-IV ever | 38% | 50% | 46% | 1 | 0,21 |\n| Angina | 60% | 70% | 41% | 0.45 | 0.68 |\n| Syncope | 19% | 15% | 27% | 0.64 | 1 |\n| Non-sustained ventricular tachycardia | 25.3% | 42.1% | 40% | 1 | 0.10 |\n| Abnormal blood pressure response | 10.8% | 31.6% | 67% | 0.9 | 0.030 |\n| Maximum left ventricular wall thickness(mm) | 22 (6) | 25 (7) | 27 (8) | 0.16 | 0.001 |\n| Wall thickness ≥ 30 mm | 13% | 15% | 39% | 0.95 | 0.09 |\n| Shortening fraction (%) | 39 (10) | 39 (11) | 43 (10) | 0.29 | 0.67 |\n| Left atrial diameter (mm) | 45 (7) | 50 (11) | 50 (14) | 0.79 | 0.038 |\n| Gradient ≥ 30 mmHg | 29% | 35% | 31% | 1 | 0.89 |\n\n#### (ii) Comparative between the phenotype of individuals with and without mutation\n\nThere were significant differences in age at time of diagnosis, abnormal blood pressure response, in maximum left ventricular wall thickness and left atrial diameter between patients with mutation (in MYH7 or MyBPC3) and patients without mutation (Table 2).\n\nIndex cases, with mutation were diagnosed younger (p = 0.049), had larger abnormal blood pressure response (p = 0.030), larger left ventricular wall thickness (p = 0.001) and larger left atrial diameter (p = 0.038).\n\nIndex cases with mutation had larger frequency of familial history and non-sustained ventricular tachycardia than index cases without mutation, although these differences were not significant.\n\n#### (iii) Familial genetic study\n\nA genetic study was carried out in 46 positive index cases relatives: 24 were carriers and 22 non-carriers. Out of those 24 carriers, 14 showed HCM, 4 with suggestive electrocardiographic alterations but not HCM diagnostic (H73-II:6 = D75N H197-III:4 = R502Q, H76-II:7 = K504del and H160-IV:2 = P955fs,)], and 6 women, ages 25 (H279-III:2 = V471E), 29 (H95-III:6 = E1179K), 32 (H95-III:2 = E1179K), 33(H131-IV:4 = IVS29+5G>A), 49 (H46-III:4 = K504del) and 68 (H73-II:7 = D75N), were healthy carriers. Within those 22 non-carriers, 18 were considered healthy, 1 with sugestive electrocardiographic alterations (H73-II:3 = D75N), 2 probably affected (H49-IV:1 & IV:5 = R1022P) and 1 case presented HCM (H153-II:1 = E542Q).\n\nSD as the most serious adverse event was prevalent in 5 of the 20 positive index cases. No genetic test was available for these cases. SDs occurred in 2 of 3 families with splice mutations (H56 = IV6+5G>A, H131 = IVS29+5G>A,), in 1 of 3 with frameshift mutations (H160 = P955fs) and in 2 of 9 with missense mutations (H42 = A216T, H166 = E542Q).\n\nEight individuals of five families suffered from SD between the ages of 15 and 51.\n\nClinical data of the index cases and carriers can be found in Additional file 1. Figure 2 and figure 3 showed the pedigree of frameshift and splice mutations, and new missense mutations, respectively.\n\n### Discussion\n\nThis study has allowed us to identify mutation in MyBPC3 in 15% of our index cases, whereas in MYH7 were 8% in the same cohort [10]. As in other previous studies, the MyBPC3 mutations are more frequently a cause of HCM than mutations in MYH7 [18,20-23].\n\nIn our study, no family presented two mutations in MyBPC3 or in MyBPC3+MYH7. However, previously we have described in this cohort a family with two mutations (R787H and I736T) in MYH7 [10]. This provides us a 0.8% of multiple mutation cases, a lower percentage than the described in the literature (≈ 3%) [18,24,25]. As looking for additional mutations, we also tested all patients, using a genotyping platform which included 537 known mutations in other HCM disease genes (TNNT2, TNNI3, TPM1, MYL2, MYL3, ACTC, TTN, MYH6, MYLK2, MYO6, TCAP). None of the index cases in this study had additional mutations in these genes. However, it is possible that there might be new mutations in these genes or mutations in other genes.\n\nThe percentages described in this study, 15% for MyBPC3 mutations and 0.8% for multiple mutations, were lower than the described in the literature. The high percentage described could be due to polymorphic variants considered as mutations and the inclusion of related probands. In our study, we considered a variation as a mutation if it was not present in 200 unrelated healthy individuals and our index cases were unrelated.\n\nWe have not found significant differences between phenotypes of MyBPC3 and MYH7 carriers, as it has been previously described [24].\n\n#### (i) Not previously described mutations\n\nThe pathogenicity of the new mutations must be established based upon criteria of cosegregation, absence in health controls, conservation in the evolution and planned functional alteration.\n\nPathogenicity is very likely in mutations to provoke the introduction of premature stop codons [26,27], including mutations IVS6+5G>A, IVS11-9G>A, and Q327fs (Table 1 and Figure 2). These truncation mutations could affect protein binding to the thick filament and they could alter the sarcomere's structure and function. In fact, these mutations have been associated to the most severe manifestations of HCM and their association with the disease has been confirmed in animal models [28-30]. However, functional studies of these mutations will be essential to elucidate if they act through a dominant-negative mechanism, if the resulting protein continues to be incorporated into the A-band, or through haploinsufficiency, if the enhanced proteolysis of the truncated protein rather alters the stoichiometry of sarcomeric proteins [31].\n\nPathogenicity is more difficult to confirm in new mutations of the missense type (D75N and V471E). These mutations did not show up in 200 healthy controls and they affected conserved residue. Moreover, the use of in silico tools to predict the pathogenicity of missense mutations showed that D75N and V471E were \"likely\" to be pathological (at least two online programs predicted a damaging effect, Table 1). However, the number of identified carriers is scarce and there are several cases of healthy carriers. The presence of healthy carriers is frequent in the mutations in MyBPC3 due to they can have incomplete penetrance and late development in the hypertrophy [11]. To explain these cases we can speculate that, in the case of V471E, one young healthy women carriers could have had a late onset of the disease expression, and in the case of D75N, as the index cases had been diagnosed at the age of 66, the healthy 68 women could develope HCM in the following years. In favour of their relationship with the disease, we have not identified relatives with HCM who do not carry the mutations. Unless, a relative of D75N index case was probably affected but does not have the mutation; this fact could mean that another factor could be contributing to the development of the HCM.\n\nTherefore, in order to establish the pathogenicity of new mutation, more data about affected and non-affected relatives is needed, and this is not always possible, as in the cases of dead subjects and in those who have declined to participate.\n\n#### (ii) Previously described mutations\n\nThe identification of a known mutation is clinically more useful, because previous information allows for a better evaluation of the pathogenicity and the genotype-phenotype correlation. For example, the familial study in mutation K504del does not let us confirm its pathogenicity (out of four carriers, one is healthy and another one is questionable, Additional file 1), but the existence of 2 previously described families [18,21] supports the association of the mutation with the disease. In the same way, one of the families with E542Q mutation (H153) has a member who is probably affected and who does not have the mutation. The existence of multiple families in our study (H166, H641) and in other nine families described in the literature [14,18,22-24,32-34] allows us to confirm its association with the disease and it forces us to review its diagnosis (the light-moderate hypertrophy in the electrocardiogram must be confirmed).\n\nWhereas, in mutation R1022P, two possible HCM patients do not have the mutation, and in the case previously described in the literature there are no data about the familial study [16], so it is not possible to verify its pathogenicity.\n\nOn the other hand we provide useful information for the clinicians, like in mutation K600fs (Figure 2), our data confirms the pathogenicity of a previously described mutation in just one case without available clinical data or familial study [18].\n\n#### (iii) Severe and early forms of HCM and SD in patients with mutations in MyBPC3\n\nIt has been suggested that mutations in gene MyBPC3 are associated with a light clinical and morphological expression and with a late development of hypertrophy [11,35]. However, we identify a relevant number of cases with early severe hypertrophy development, as in the cases of carriers of the following mutations: R502Q, a post-myectomy 42 year old with 20 mm and another 36 mm case at 15; and P955fs, a 28 mm case at 36 and a 16 year old female with 21 mm. Moreover, we also have cases with atrial fibrillation at a young age (K600fs, R1022P, IVS6+5G>A) and several cases of people who underwent surgery when they were young (R502Q and IVS6+5G>A). Nevertheless, when we gather data about our families and those from previous studies [11,14,16,18,21-24,32-35] (Table 3), we see that in several mutations (R502Q, E542Q, K600fs, P955fs) average age at time of diagnosis is not advanced and thickness is above average in HCM.\n\n### Table 3\n\nGenotype-phenotype correlation in previously described mutations.\n\n| Mutation | R502Q | K504del | E542Q | K600fs | P955fs | R1022P |\n|---|---|---|---|---|---|---|\n| No. of carriers (HCM/healthy) | 23 (17/6) | 6 (5/1) | 18 (16/0) | 3 (3/0) | 19 (15/4) | 6 (6/0) |\n| No. of non-carriers (HCM/healthy) | 10 (0/10) | 2 (0/2) | 11 (1/10) | 3 (0/3) | 9 (0/9) | 5 (2/3) |\n| No. of controls | 350 | 450 | 550 | 200 | 400 | 100 |\n| Mean age at HCM diagnosis (range) | 44 (15-81) | 38 (21-59) | 45 (16-53) | 47 (44-50) | 25 (16-36) | 42 (23-67) |\n| Mean maximal wall thickness (range) | 22 (10-37) | 19 (9\n\n[… truncated 18,144 of 42,144 characters. Full text: MYBPC3/20433692/1788706483312734000-000015-074bfe41_paper_curation_independent_clinical_reader.json …]","role":"user"}],"model":"openai/gpt-6-astra","num_retries":0,"reasoning_effort":"medium","response_format":{"type":"json_object"},"timeout":1200},"provider":"litellm","requested_model":"azure_ai/gpt-6-astra","resolved_model":"openai/gpt-6-astra","started_at":"2026-09-06T14:38:08.168971+00:00"},"response":{"completed_at":"2026-09-06T14:54:43.312592+00:00","duration_seconds":995.132377,"envelope":{"choices":[{"finish_reason":"stop","index":0,"message":{"annotations":[],"content":"{\n  \"variants\": [\n    {\n      \"variant\": \"D75N\",\n      \"carriers\": 3,\n      \"affected\": 1,\n      \" get-gene variants and the numbers of HUMAN individuals carrying each\nvariant in this article's study. Read methods, results, tables, footnotes, and\narticle-bound supplements together. Extract three distinct fields:\n- carriers: distinct human people reported to carry this particular variant;\n- affected: those carriers explicitly described as symptomatic/phenotype-positive;\n- unaffected: those carriers explicitly described as asymptomatic/phenotype-negative.\nA count can be absent even when the variant identity is present. Return null for\nabsence or uncertainty; never convert null to zero. Zero needs explicit evidence.\n\nPreserve study, variant, and person-unit ownership. Do not substitute allele or\nchromosome counts, allele frequencies, families, electrophysiology replicates,\nanimals, or the overall number screened for per-variant people. A multi-variant\ncohort total cannot be copied onto each variant. Do not treat every case in a\ndisease-ascertained cohort as affected without applicable phenotype evidence.\nDo not infer unaffected by subtracting affected from carriers. Do not add\ncurrent-study and cited prior-study cohorts, or overlapping patient lists.\n\nPrefer an explicit per-variant count. If a patient-level table uniquely identifies\neach person, a count may instead be derived by enumerating and deduplicating\nthose exact patient IDs, joining tables only through explicit IDs. In that case\nlabel the basis individual_rows and return all IDs and the verbatim source rows\nsupporting the derivation. Do not manufacture a literal quote containing a sum.\nIf layout/merged cells or IDs make ownership ambiguous, return null and explain.\n\nFor each non-null field provide that field's own evidence: a verbatim contiguous\nquote or exact table header plus row, source locator, count role, basis, and scope.\nThe normal downstream validator may refuse a derivation even if you consider it\nvalid; your job here is an independent reading, with all uncertainty retained.\nDo not seek external sources or use remembered facts about the paper.\n\nReturn JSON only:\n{\"variants\":[{\"variant\":\"paper's variant notation\", \"carriers\":null,\n\"affected\":null,\"unaffected\":null,\n\"carriers_evidence\":{\"quote\":\"exact source span\", \"count_role\":\"per_variant_carriers\", \"basis\":\"explicit|individual_rows|none\", \"scope\":\"current_study|prior_study|unclear\", \"person_ids\":[], \"evidence_locator\":{\"kind\":\"sentence|table_row|patient_rows\", \"section\":\"\", \"table\":\"\", \"column\":\"\", \"row\":\"\"}},\n\"affected_evidence\":{},\"unaffected_evidence\":{},\"uncertainty\":\"\"}],\n\"clinical_count_status\":\"present|not_reported|ambiguous\", \"unresolved_sources\":[]}\n\nUse per_variant_affected and per_variant_unaffected for the respective field's\nrole. Include only the target gene and biological variants actually in the source.\n\n--- ARTICLE SOURCE ---\n# MAIN TEXT\n\n## Unexpectedly Low Mutation Rates in Beta-Myosin Heavy Chain and Cardiac Myosin Binding Protein Genes in Italian Patients With Hypertrophic Cardiomyopathy\n\n### Abstract\n\nHypertrophic cardiomyopathy (HCM) is the most common genetic cardiac disease. Fourteen sarcomeric and sarcomere-related genes have been implicated in HCM etiology, those encoding β-myosin heavy chain (MYH7) and cardiac myosin binding protein C (MYBPC3) reported as the most frequently mutated: in fact, these account for around 50% of all cases related to sarcomeric gene mutations, which are collectively responsible for approximately 70% of all HCM cases. Here, we used denaturing high-performance liquid chromatography followed by bidirectional sequencing to screen the coding regions of MYH7 and MYBPC3 in a cohort (n = 125) of Italian patients presenting with HCM. We found 6 MHY7 mutations in 9/125 patients and 18 MYBPC3 mutations in 19/125 patients. Of the three novel MYH7 mutations found, two were missense, and one was a silent mutation; of the eight novel MYBPC3 mutations, one was a substitution, three were stop codons, and four were missense mutations. Thus, our cohort of Italian HCM patients did not harbor the high frequency of mutations usually found in MYH7 and MYBPC3. This finding, coupled to the clinical diversity of our cohort, emphasizes the complexity of HCM and the need for more inclusive investigative approaches in order to fully understand the pathogenesis of this disease. J. Cell. Physiol. 226: 2894–2900, 2011. © 2011 Wiley-Liss, Inc.\n\n### Materials and Methods\n\n#### Clinical evaluation of patients\n\nOne hundred thirty-six Italian patients (n = 125 unrelated) diagnosed with HCM between 2005 and 2007 by cardiologists at the dedicated cardiomyopathy outpatient clinic of Azienda Ospedaliera Sant'Andrea, Sapienza University of Rome, were enrolled for the study. The study was approved by the Internal Ethic Committee of Azienda Ospedaliera Sant'Andrea, and all participants gave written informed consent to be included in the study. Patients with any relative diagnosed with HCM were considered familial cases, and patients without a family history of HCM and affected relatives were considered sporadic cases. When carriers were found, screening was suggested for first-degree family members.\n\nAll probands and relatives underwent physical examination, 12-lead electrocardiogram, two-dimensional echocardiography, Doppler studies, and 24-h Holter monitoring. The diagnosis of HCM was based on echocardiographic demonstration of a hypertrophied and non-dilated left ventricle (wall thickness ≥15 mm in adults, or the equivalent relative to body surface area in children) in the absence of other cardiac or systemic diseases that could produce a comparable magnitude of LV hypertrophy (Spirito et al., 2000). The greatest thickness measured at any site in the LV wall was considered to represent the maximal wall thickness (Spirito et al., 2000). End-diastolic LV cavity and left atrial dimensions were assessed from the derived M-mode echocardiogram. LV outflow tract obstruction was considered present when the peak instantaneous outflow gradient estimated by continuous wave Doppler was ≥30 mm Hg under basal conditions (Maron et al., 2003; Autore et al., 2005).\n\n#### Genetic analysis\n\n##### Sample preparation\n\nAliquots of 5 ml of peripheral blood were collected in tubes containing EDTA. Genomic DNA was extracted using DNA Qiamp Midi kit (QIAGEN, Crawley, UK) according to the manufacturer's instructions. The suitability for sequencing of genomic DNA was verified spectrophotometrically (Thermo Fisher Scientific, Barrington, IL).\n\n##### PCR primers and exon amplification for DHPLC\n\nMutational analysis of the exons and exon/intron boundaries (at least 35 intron nucleotides from the junctions) of MYH7 and MYBPC3 was carried out with DHPLC. For all samples with an abnormal DHPLC elution profile, the putative sequence anomaly was investigated by automated dye terminator cycle (bidirectional) sequencing. Primer pairs were designed to amplify MYH7 and MYBPC3 exon-containing fragments. Primers were compared by the web-based Primer3 program (PRIMER3; primer3_http://www.cgi, v 0.2; http://frodo.wi.mit.edu). Each oligonucleotide was also checked by Blast against the NCBI data bank genome for specificity (BLAST, http://www.ncbi.nlm.nih.govBLAST; NCBI, http://www.ncbi.nlm.nih.gov). Primer sequences are given in Supplementary Tables S1 (MYH7) and S2 (MYBPC3). PCR reactions were set up in 25 µl containing the following: 15 pmol of each primer, 1× PCR buffer with 1.5 mM magnesium chloride, 200 µM of each deoxynucleotide triphosphate (Amersham, Little Chalfont, UK), 1.25 U of Ampli-Taq Gold DNA polymerase (Applied Biosystems, Foster City, CA), and 60 ng of DNA. The conditions used were as follows: a denaturation step at 95°C for 7 min; 34 cycles at 95°C for 30 sec., annealing at 60°C for 90 sec, and extension at 68°C for 60 sec, adding 3 sec for each cycle; a final extension at 68°C for 10 min. All PCR reactions were carried out in a PCR Express Thermalcycler (Celbio, Milan, Italy). The same annealing temperature for all the exons was used, allowing different exons to be amplified in the same 96/384-well plate. The PCR products were stored at 4°C before DHPLC analysis.\n\n##### Experimental conditions for DHPLC\n\nDHPLC analysis was carried out with the WAVE DNA fragment analysis system, using models 3500A and 3500HT (Transgenomic, Omaha, NE). A PCR size range of 150–450 bp was used in order to reach >95% sensitivity. The PCR mixture (5–8 µl) was injected into a preheated C18 reversed-phase column with non-porous (polystyrene/divinylbenzene) particles (DNASepTM column; Transgenomic). The injected sample was then eluted by a linear acetonitrile gradient consisting of buffer A and buffer B. DNA was detected at 260 nm. Melting curves were predicted using Wavemaker software (Transgenomic), and a comparison of the retention times at different temperatures was performed with control fragments bearing known variations. Each variation was usually detectable in a range of ±1.5°C. The typical analytical gradient time was 3.5 min with the 3500A model and 2.5 min with the 3500HT model. Buffer B concentration was increased at 2% per min.\n\n##### DNA sequencing\n\nThe PCR amplicons were purified with Exo-Sap enzymes (Applied Biosystems) and then sequenced. Direct sequencing was performed by automated cycle sequencing with a 3130XL Genetic Analyzer (Applied Biosystems). The sequencing reaction was performed with the following protocol: 2.5 pM/µl for each primer (forward or reverse), 2 µl of Big Dye Terminator mix (Perkin Elmer, Boston, MA) containing dideoxyribonucleotides, deoxyribonucleotides, a Taq polymerase, 5× TACS buffer (400 mM Tris–HCl, pH 8, 10 mM MgCl2, and 100 mM SO4(NH4)2, pH 9), 5 µl of DNA (100 ng), and H2O to a final volume of 10 µl. At the end of the sequencing reaction the samples were purified on a Sephadex G50 membrane by centrifugation at 1,700 rpm for 2 min; 5 µl of the purified sample thus obtained was added to 10 µl of deionized formamide and denatured for 3 min at 95°C before being subjected to electrophoresis. The electrophoresis apparatus used was an ABI PRISM 3100 automatic sequencer (Applied Biosystems).\n\n#### Statistical analysis\n\nAll continuous data are given as mean ± SD. Baseline characteristics between two groups were analyzed by Student's t-test for continuous variables and by the Fisher exact test for categorical data.\n\n### Results\n\n#### Patients\n\nThe clinical characteristics, including electrocardiographic and echocardiographic data, of the patients are given in Table 1 (see also Supplementary Table S3). Most of the patients (87.2%) were born in Rome or in other parts of the Lazio region; 16 were from other regions of Italy. Fifty-one had a family history of HCM. The majority of patients (92%) were asymptomatic or mildly symptomatic; 10 had moderate or severe symptoms of heart failure (NYHA class III–IV) and 6 had progressed to the “end-stage phase” of the disease, with impaired LV systolic function (ejection fraction <50%). At echocardiography, 40 patients presented with an LV outflow tract obstruction. In most patients, hypertrophy was localized to the anterior septum, whereas it was apical in only 12. Interventions and events are also given in Table 1. In 19 patients judged to be at high risk of sudden death, a cardioverter-defibrillator (ICD) had been implanted as a primary prevention; 4 of them had already experienced one appropriate intervention (ICD intervention). Two patients experienced non-fatal stroke and another underwent myotomy/myectomy.\n\n### Table 1\n\nClinical Features of Unrelated HCM Patients at Time of Genetic Testing\n\n| Clinical features | Patients (n = 125) |\n|---|---|\n| Men (%) | 79 (63.2) |\n| Age at study (yrs) | 54.2 ± 16b |\n| Age at diagnosis (yrs) | 40.7 ± 18b |\n| Family history of HCM (%) | 51 (40.8) |\n| Family history of SCD (%) | 38 (30.4) |\n| NYHA III–IV functional class (%) | 10 (8.0) |\n| Chest pain (%) | 55 (44.0) |\n| Syncope (%) | 19 (15.2) |\n| NSVT (%) | 14 (10.9) |\n| Atrial fibrillationa (%) | 16 (12.8) |\n| Electrocardiographic analysis |  |\n| LVH (%) | 79 (63.2) |\n| Q wave (%) | 39 (31.2) |\n| T wave inversion (%) | 82 (65.6) |\n| Echocardiographic features |  |\n| LVOT obstruction (%) | 40 (32.0) |\n| Left atrium (mm) | 45.5 ± 7b |\n| Maximum LVWT (mm) | 19.9 ± 5b |\n| LVEF (%) | 65.1 ± 7b |\n| Localization of hypertrophy |  |\n| Anterior septum (%) | 97 (77.6) |\n| Posterior septum (%) | 6 (4.8) |\n| Lateral wall (%) | 10 (8.0) |\n| Apical wall (%) | 12 (9.6) |\n| Interventions and events |  |\n| ICD (%) | 19 (15.2) |\n| Myotomy/myectomy (%) | 1 (0.8) |\n| Alcohol septal ablation (%) | 0 (0) |\n| End stage evolution (%) | 6 (4.8) |\n| Stroke (%) | 2 (1.6) |\n| ICD intervention (%) | 4 (3.2) |\n\n#### Genetic analysis\n\nThirty-two individuals in our cohort of 136 HCM patients (23.5%) were found carrying mutations: of these, 28 were unrelated, accounting for 22.4% of the 125 unrelated patients. Specifically, 6 distinct mutations were found in MHY7 in 9/125 (7.2%) patients and 18 distinct mutations were found in MYBPC3 in 19/125 (15.2%) patients (Tables 2 and 3, respectively). All mutations were in heterozygosis. Multiple mutations, present either within the same gene or in both genes contemporaneously, were not encountered. A total of 384 chromosomes from healthy, unrelated Italian subjects were used as controls.\n\n### Table 2\n\nVariations Detected on MYH7* by DHPLC Followed by Direct Sequencing**\n\n| DNA variation | Exon | Type of mutation | Protein mutation | Novel | Patient ID |\n|---|---|---|---|---|---|\n| Panel (a) mutationsa |  |  |  |  |  |\n| c.1331 A>G | 12 | Missense | N444S | Yes | 154 |\n| c.2795 T>A | 21 | Missense | M932K | No | 201 |\n| c.4954 G>T | 33 | Missense | D1652Y | Yes | 183 |\n| c.4472 C>G | 30 | Missense | S1491C | No | 190c, 199c, 206, 293 |\n| c.1549 C>A | 13 | Missense | L517M | No | 248 |\n| c.3153 G>A | 23 | Silent | A1051A | Yes | 273, 227 |\n\n| DNA variation | Exon/intron | Type of SNP | Protein variation | Noveld | Patient ID |\n|---|---|---|---|---|---|\n| Panel (b) SNPs |  |  |  |  |  |\n| c.732 C>T | Exon 6 | Synonymousb | F244F | rs2069542 | 219, 299, 93, 230, 273, 255 |\n| c.597 A>G | Exon 5 | Synonymous | A199A | rs2069541 | 291, 260, 288, 289, 189 |\n| c.2967 T>C | Exon 22 | Synonymous | I989I | Yes | 167, 217 |\n| c.4566 T>C | Exon 31 | Synonymousb | T1522T | Yes | 172 |\n| c.4193A>T | Exon 29 | Non-synonymous | Q1398L | Yes | 182 |\n| −110 t>c | −110 t>c | 5' UTR | — | Yes | 162, 95, 165, 242 |\n| c3855+27 t>a | Intron 26 | — | c.3855+27t>a | Yes | 173, 203, 229, 255, 261, 280, 299 |\n| c.5655+32 g>a | Intron 36 | — | c.5655+32g>a | Yes | 173, 203, 280, 284, 290 |\n\n### Table 3\n\nVariations Detected on MYBPC3* With DHPLC Followed by Direct Sequencing**\n\n| DNA variation | Exon | Type of mutation | Protein mutation | Novel | Patient ID |\n|---|---|---|---|---|---|\n| Panel (a) mutationsa |  |  |  |  |  |\n| c.1090G>A | 11 | Potential splicing alteration | A364T | No | 233 |\n| c.1813G>C | 17 | Potential splicing alteration | D605H | No | 180c, 186c, 208c |\n| c.1624G>C | 15 | Potential splicing alteration | E542Q | No | 244 |\n| c.2309-2A>G | 22 | Potential splicing alteration | 2309−2 | No | 234 |\n| c.2905+1G>A | 25 | Potential splicing alterationb | 2905+1 | Yes | 157 |\n| c.2905C>T | 25 | Nonsense: STOP codon | Q969X | No | 188 |\n| c.2827C>T | 25 | Nonsense: STOP codon | R493X | Yes | 220 |\n| c.3034C>T | 27 | Nonsense: STOP codon | Q1012X | No | 181 |\n| c.3697C>T | 31 | Nonsense: STOP codon | Q1233X | No | 251 |\n| c.2846–2847InsT | 25 | Frameshift: STOP codon | M949IfsX100 | Yes | 278 |\n| c.2258–2259InsT | 21 | Frameshift: STOP codon | K754EfsX78 | Yes | 195, 228 |\n| c.3192–3193InsC | 28 | Frameshift: STOP codon | K1065QfsX11 | No | 194 |\n| c.2654C>T | 24 | Missense | T885M | Yes | 265 |\n| c.2002C>T | 19 | Missense | R668C | Yes | 214 |\n| c.3251T>C | 28 | Missense | L1084P | Yes | 177d, 185d |\n| c. 2311G>A | 22 | Missense | V771M | No | 221 |\n| c.2429 G>A | 25 | Missense | Arg810His | Yes | 270 |\n| c.1373G>A | 14 | Missense | R458H | No | 268 |\n\n| DNA variation | Exon/intron | SNP | Novele | Protein variation | Patient ID |\n|---|---|---|---|---|---|\n| Panel (b) SNPs |  |  |  |  |  |\n| c.472G>A | Exon 4 | Non-synonymous | rs3729986 | V158M | 270 |\n| c.977G>A | Exon 11 | Non-synonymous | rs34580776 | R326Q | 251 |\n| c.1564 G>A | Exon 15 | Non-synonymous | rs11570082 | A522T | 221 |\n| c.492 C>T | Exon 4 | Synonymous | rs3218719 | G164G | 214 |\n| c.2550 C>T | Exon 23 | Synonymous | rs3729953 | V849V | 278, 251, 268 |\n| c.3288 G>A | Exon 28 | Synonymous | rs1052373 | E1096E | 234 |\n| c.506–12 | Intron 4 | — | Yes | delC | 195, 251, 270 |\n| c.1223+29 G>A | Intron 12 | Synonymous | rs11570078 | — | 181, 221, 194 |\n| c.2340+18 C>G | Intron 21 | Synonymous | rs3729948 | — | 278, 251 268, 194 |\n| c.2737+12 C>T | Intron 24 | Synonymous | rs3729936 | — | 251, 268, 194 |\n\n#### Mutations in MYH7\n\nSix variations present in MYH7 (4.8%) were distinct mutations that were not found in the control group (Table 2a). Three were novel and carried by 4/125 (3.2%) patients, whereas the other 3/6 were known mutations harbored by 5/125 (4%) patients.\n\n##### Novel mutations\n\nTwo of the mutations found (N444S and D1652Y) were novel missense mutations. A third (A1051A) was a silent mutation harbored by two unrelated patients. Figure 1 gives the location of these novel mutations in a schematic representation of the MYH7 protein. Electropherograms and chromatograms for the novel mutations found in MYH7 are given in Supplementary Figure 1.\n\n##### Known mutations\n\nThree of the mutations encountered are already listed in public databases: L517M is a missense mutation that has a pathogenic effect and has been linked to HCM with progression to dilated cardiomyopathy (Nanni et al., 2003); M932K is another missense mutation (Iascone et al., 2007); S1491C (Hougs et al., 2005) was found in four of our subjects (two unrelated patients and a mother/daughter pair).\n\n#### Mutations in MYBPC3\n\nEighteen distinct mutations were found in MYBPC3 (14.4%): five were potential alternative splicing sites (all generated by nucleotide substitutions), seven were stop codons (four caused by nonsense substitutions and three formed from insertions generating frameshifts), and six were missense mutations (Table 3a). Nine (7.2%) unrelated patients harbored novel mutations, whereas 10/125 (8%) carried known mutations. Three of the mutations were present in more than one patient.\n\n##### Novel mutations\n\nEight out of the 18 mutations detected (6.4%) were novel: c.2905+1 was a substitution potentially causing the excision of exon 25 through altered splicing; 3 were mutations that produced premature stop codons, 1 of which (R493X) was caused by a nonsense nucleotide substitution and 2 of which were caused by nucleotide insertions (M949IfsX100 and K754EfsX78); the remaining 4 (T885M, R668C, L1084P, and R810Q) were missense mutations with a probable pathogenic effect caused by the substitution of an amino acid. L1084P was detected in a father/son pair, and the novel insertion K754EfsX782 was carried by two unrelated patients, one of which (patient ID 195) presented also with a delC in intron 4, only 12 bp upstream of exon 5. Figure 2 is a schematic summary of the novel variations recorded. Electropherograms and chromatograms for novel mutations detected in MYBPC3 are given in Supplementary Figure 2.\n\n##### Known mutations\n\nTen out of the 18 mutations detected (8%) are already described in public mutation databases: A364T (Smaniotto et al., 2009), D605H (Alders et al., 2003), E542Q (Carrier et al., 1997), and c.2309-2A>G (Niimura et al., 2002) are substitutions potentially generating splicing alterations, the last one found in the intronic side of the junction and D605H harbored by three related patients (father, son, and nephew); three (Q969X, Q1012X, and Q1233X) are nonsense mutations creating stop codons in exons 25, 27, and 31, respectively (Yu et al., 1998; Erdmann et al., 2001; Nanni et al., 2003); K1065QfsX11 (Girolami et al., 2006) is a nucleotide insertion generating, through a frameshift, a premature stop codon in exon 28; V771M (Garcia-Castro et al., 2005); and R458H (Van Driest et al., 2004) are missense mutations caused by amino acid substitutions in exon 22 and 14, respectively (Cardiogenomics Mutation Database, 2005; HGMD, http://www.hgmd.cf.ac.uk/ac/all.php).\n\n#### Polymorphisms\n\nIn addition to the above mutations, we found several SNPs.\n\n##### MYH7\n\nWe found 6 distinct novel SNPs in MYH7 in 31 patients. All but two of these SNPs were detected in more than one patient (Table 2b): three (I989I, T1522T, and Q1398L) resided in the coding region—except for Q1398L these were synonymous variations; three were nucleotide substitutions present either in the 5'UTR (−110t>c), in intron 26 (c.3855+27t>a), or in intron 36 (c.5655+32g>a). F244F and T1522T were substitutions of the last nucleotide of exons 6 and 31, respectively, causing possible splicing alterations. Only two distinct synonymous SNPs (F244F and A199A) have already been described (http://cardiogenomics.med.harvard.edu/home). At the moment, we can only indicate these genetic alterations as polymorphisms of doubtful etiologic role in that they were not found in 384 chromosomes from control subjects.\n\n##### MYBPC3\n\nTen different SNPs where found in MYBPC3 in 21 patients; 5 of these SNPs were found to be present in more than 1 patient (Table 3b). Three were non-synonymous changes (rs3729986—V158M—carried by R810Q, rs34580776—R326Q—carried by Q1233X, and rs11570082—A522T—carried by V771M) with a potential functional effect on the protein. Six were known synonymous SNPs. Only one, a delC in intron 4, was a novel SNP found in multiple patients (Table 3b).\n\n#### Prediction of the missense mutations' effect on the protein, and genotype/phenotype correlation\n\nTo obtain more functional information on those mutations and polymorphisms that caused an amino acid change, we used the in silico bioinformatic tool PolyPhen (http://genetics.bwh.harvard.edu/pph/) to functionally classify the novel variations detected. PolyPhen categorizes variations to indicate the predicted effect on the protein as benign, possibly damaging, or probably damaging.\n\n##### MYH7\n\nN444S, D1652Y, and L517M were predicted to be damaging for the function of the protein, whereas M932K and S1491C were defined as benign (Table 4a). The novel non-synonymous SNP Q1398L was also predicted as being damaging.\n\n### Table 4\n\nPrediction of the Functional Effect of the Detected Genetic Variations* With Polymorphism Phenotyping (PolyPhen)\n\n| Gene sequence variation | Protein sequence variation | Functional prediction | PSIC score difference |\n|---|---|---|---|\n| Panel (a) MYH7 |  |  |  |\n| c.1331 A>G exon 12 | N444S | Probably damaging | 2.484 |\n| c.4193 A>T exon 29 | Q1398L | Probably damaging | 2.470 |\n| c.4954 G>T exon 33 | D1652Y | Possibly damaging | 2.660 |\n| c.1549 C>A exon 13 | L517M | Possibly damaging | 1.723 |\n| c.2795 T>A exon 21 | M932K | Benign | 0.864 |\n| c.4472 C>G exon 30 | S1491C | Benign | 0.155 |\n\n| Gene sequence variation | Protein sequence variation | Functional prediction | PSIC score difference |\n|---|---|---|---|\n| Panel (b) MYBPC3 |  |  |  |\n| c.2002 C>T exon 19 | R668C | Probably damaging | 2.572 |\n| c.3251 T>C exon 28 | L1084P | Probably damaging | 2.346 |\n| c.1090 G>A exon 11 | A364T | Possibly damaging | 1.760 |\n| c.2654 C>T exon 24 | T885M | Possibly damaging | 1.983 |\n| c.2429 G>A exon23 | R810Q | Possibly damaging | 1.947 |\n| c.472 G>A exon4 | V158M (rs3729986) | Benign | 1.051 |\n| c.2311 G>A exon22 | V771M | Benign | 1.435 |\n| c.1564 G>A exon15 | A522T (rs11570082) | Benign | 0.206 |\n| c.1624 s_details.reasoning_tokens":157},"response_paths":[]},"reasoning_limit":"Private hidden chain-of-thought is not exposed by model APIs. Only explicit model rationales and provider-returned reasoning summaries/content can be recorded.","record_type":"llm_call","request":{"payload":{"allowed_openai_params":["reasoning_effort"],"api_base":"https://magen-api-2-resource.services.ai.azure.com/openai/v1","api_key":"<redacted>","max_completion_tokens":32000,"messages":[{"content":"Read the supplied biomedical article independently as a clinical evidence curator.\nTarget gene: RYR2. Article PMID: 18929323.\n\nIdentify target-gene variants and the numbers of HUMAN individuals carrying each\nvariant in this article's study. Read methods, results, tables, footnotes, and\narticle-bound supplements together. Extract three distinct fields:\n- carriers: distinct human people reported to carry this particular variant;\n- affected: those carriers explicitly described as symptomatic/phenotype-positive;\n- unaffected: those carriers explicitly described as asymptomatic/phenotype-negative.\nA count can be absent even when the variant identity is present. Return null for\nabsence or uncertainty; never convert null to zero. Zero needs explicit evidence.\n\nPreserve study, variant, and person-unit ownership. Do not substitute allele or\nchromosome counts, allele frequencies, families, electrophysiology replicates,\nanimals, or the overall number screened for per-variant people. A multi-variant\ncohort total cannot be copied onto each variant. Do not treat every case in a\ndisease-ascertained cohort as affected without applicable phenotype evidence.\nDo not infer unaffected by subtracting affected from carriers. Do not add\ncurrent-study and cited prior-study cohorts, or overlapping patient lists.\n\nPrefer an explicit per-variant count. If a patient-level table uniquely identifies\neach person, a count may instead be derived by enumerating and deduplicating\nthose exact patient IDs, joining tiating mechanism of pVT, whereas an increase in transmural dispersion of repolarization (TDR) controls degeneration of pVT to ventricular fibrillation. U-wave and T-wave peak to T-wave end interval (TPE) are regarded as electrocardiographic counterparts of DAD and TDR, respectively. Objective We tested hypotheses that patients with CPVT might show abnormal U-waves and TPE intervals and that beta-blockers could suppress appearance of these repolarization abnormalities. Methods We reviewed Holter recordings from 19 CPVT patients with a RyR2 mutation (P2328S or V4653F) and from 19 healthy unaffected subjects to record U-waves and TPE intervals as well as to measure beta-blockers' effects on ventricular repolarization by use of an automated computerized program. Results The maximal U-wave to T-wave amplitude ratio was 0.8 ± 0.6 in CPVT patients and 0.4 ± 0.3 in unaffected subjects ( P = .009). Patients with most ventricular extrasystoles had a higher U-wave to T-wave amplitude ratio than those with fewest extrasystoles. Treatment with beta-blockers decreased U-wave amplitude at high heart rates. CPVT patients had longer TPE intervals than unaffected subjects at high heart rates, and beta-blocker treatment shortened their TPE intervals. Conclusion Present data support the hypothesis that U-waves associate with the DAD-triggered extrasystolic activity in CPVT patients. Patients with a RyR2 mutation show increased TPE at high heart rates. Beta-blocker treatment suppresses observed repolarization abnormalities in CPVT patients.\n\n### Introduction\n\nMutations in the cardiac ryanodine receptor (RyR2) gene underlie an autosomally dominantly inherited arrhythmia syndrome called catecholaminergic polymorphic ventricular tachycardia (CPVT). 1 CPVT is characterized by exercise-related or stress-related ventricular tachycardia episodes in the absence of structural heart disease. 2 Without treatment, patients have syncopal events and a high probability of sudden cardiac death caused by malignant ventricular arrhythmias, with approximately 30% mortality by the age of 30 years. 2 Treatment with beta-blockers may prevent these cardiac events. 3 A clinical diagnosis is supported by the typical onset of ventricular arrhythmias during and fading of these arrhythmias after exercise or stress testing. As the work load and the heart rate increase, arrhythmias become more frequent and more complex until polymorphic or bidirectional ventricular tachycardia may occur. 4 In resting electrocardiogram (ECG), however, there is no known ECG marker of the syndrome. 4\n\nExperimental studies suggest that delayed afterdepolarization (DAD)–induced triggered activity is the initiating mechanism of the typical polymorphic ventricular tachycardia (pVT) in CPVT patients. 5 In a clinical study, patients with RyR2 mutations showed late-appearing U-waves coinciding with DADs, 6 suggesting U-waves as potential ECG markers of arrhythmia vulnerability. Late-appearing U-waves were distinct from simultaneous double T-waves in the same patients. 6 Similar double T-waves or T-wave humps are typical in the long QT syndrome, and the terms T1 and T2 (instead of T and U) are recommended in cases with split T-waves. 7 High T2-waves are ECG counterparts for early afterdepolarizations (EADs) 8 which mediate triggered activity as the initiating arrhythmia mechanism in the long QT syndrome. 7 Although double T-waves were observed in RyR2 mutation patients, 6 the experimental data relating T2-waves to EADs and arrhythmia mechanism in CPVT patients are lacking. On the other hand, experimental studies with a RyR2 mutation model show that an increase in transmural dispersion of repolarization (TDR) is important for the degeneration of the initially slow pVT to ventricular fibrillation. 9 In clinical electrophysiology, the T-wave peak to T-wave end (TPE) interval serves as an ECG estimate of TDR. 10\n\nRecently, Liu et al 11 showed that low-amplitude DADs are already present in unstimulated myocytes with mutant RyR2s, and beta-adrenergic stimulation enhances the development of DADs. In the clinic, however, it is unclear whether patients with RyR2 mutations show dynamic ECG ventricular repolarization abnormalities as compared with unaffected healthy subjects. We used ambulatory ECG recordings with detailed dynamic repolarization analyses 12,13 to detect these potential abnormalities. We tested the hypotheses that CPVT patients might show abnormal U-waves and abnormal TPE intervals and that beta-blockers could suppress the appearance of these repolarization abnormalities in RyR2-mutation patients.\n\n### Methods\n\n#### Study subjects\n\nWe studied 19 CPVT patients and 19 unaffected control subjects. For this study, we reviewed Finnish families with a known RyR2 mutation. Nineteen gene-positive patients coming from 2 affected families participated in the study protocol. Thus, a 24-h ECG recording was performed in each patient carrying 1 of 2 different RyR2 mutations (P2328S, n = 13, or V4653F, n = 6). Thirteen patients (68%) had either exercise-related syncope or cardiac arrest in their medical history ( Table 1 ). In the past history of the 2 families, the cumulative mortality by the age of 30 years was 31%. 2\n\nAll CPVT patients had normal findings on echocardiography, and at baseline electrolyte test, none showed electrolyte abnormalities. None of the patients were taking any medications known to affect the QT interval. The CPVT patients first performed a bicycle ergometer exercise test with continuous ECG recording. The heart rate at which ventricular bigeminy appeared was recorded. After the exercise test the 24-h ECG recording was started. Treatment with beta-adrenergic blocking agents was discontinued at least 5 drug half-lives before the exercise test until the study protocols were completed. After completing the tests, all 17 patients using regular beta-blocker medication continued the treatment. Two asymptomatic patients with no ventricular arrhythmias during exercise testing did not use beta-blocker medications. Twelve of 17 patients (P2328S, n = 6; V4653F, n = 6) repeated a second 24-h ECG recording while on a tolerable dose of a beta-blocker medication ( Table 1 ); 5 patients refused the second Holter recording.\n\nFor control subjects, we reviewed our database of genotyped unaffected healthy family members of patients with symptomatic long QT syndrome with available Holter recordings. We took the closest age match for each male patient and each female patient with a RyR2 mutation. No control subject took beta-blockers or any other medication known to affect cardiac repolarization.\n\nTable 1 shows the ECG characteristics of the study subjects. All study subjects were in sinus rhythm, and none showed a bundle-branch block. Normal daily activities were encouraged during the recordings. The study complies with the Declaration of Helsinki. The Ethical Review Committee of the Department of Medicine, University of Helsinki, approved the study and informed consent was obtained from all participants.\n\n#### Holter recordings and analyses\n\nThe 24-h ECG recordings were done using commercial tape recorders (model 8500; Marquette Electronics Inc., Milwaukee, WI). The tapes were initially analyzed with a Marquette 8000 Holter Analysis system (version 5.8 software) to label the QRS complexes to normal, ventricular extrasystoles, or aberrant complexes. The ECG data were then transferred to a personal computer for further analysis.\n\n#### Measurement of the T1-waves, T2-waves, and U-waves and QT interval durations\n\nWe first reviewed the morphology of ventricular repolarization in the 24-h ECG recordings using the superimposed scan. When 2 or 3 distinct measurable positive deflections during the repolarization were present, the first peak was regarded as a T1-wave. The second peak was interpreted as a T2-wave if it separated from or merged with the T1-wave during the recording. 12 If the second peak in the time course remained separated from the T1-wave, possibly appearing and disappearing but never merging with the T1-wave, it was interpreted as a U-wave. See Figure 1 for the explanation of the terms used. A possibly occurring third peak, never merging into the T1-wave, was also regarded as a U-wave. Figure 2 shows a representative example with simultaneously occurring T1-waves, T2-waves, and U-waves. Note the ability of the T2-wave to merge occasionally with the T1-wave and occasionally with the U-wave, whereas the U-wave remains separated from the T-wave complex.\n\nSamples with the highest T2-waves and U-wave amplitude and with the highest T2 to T1 amplitude ratios, as well as the highest U-wave to T-wave (T1 or T2, whichever was higher) amplitude ratios, were all printed on chart paper. We measured the maximal T2 to T1 amplitude ratios and corresponding U-wave to T-wave ratios manually from the ECG strips printed on chart paper at the speed of 50 mm/s and with the amplitude calibration of 0.1 mV/mm using modified lead V5. Both T1-waves and T2-waves as well as U-waves were required to be ≥0.1 mV in amplitude for the strip to be included in the measurements. We recorded the maximal values of the defined amplitude ratios as the mean of 5 consecutive beats for each individual if ≥1.1, otherwise we used the value of 1 as the individual maximum.\n\nTo measure the QT interval durations from the 24-h ECG recordings, we used a previously described method for determination of the QT intervals. 13 In this study, bifid T-waves showing a time interval of ≤0.15 s between the first peak (T1) and the later peak (T2) were calculated into the QT duration; otherwise, the later peak was not included into the QT duration. The TPE interval was measured from T1 to the end of QT interval, thus U-waves were not included in these measurements. We recorded diurnal median QT intervals at specified RR intervals determined at stable heart rates. 13 We also recorded median and maximal TPE intervals at specified heart rates. We calculated the median T-wave (T1) amplitude as well as median U-wave amplitude from corresponding values of ≥0.1 mV at specified heart rates. All analyses were done without the investigator knowing the genotypes or presence or absence of the beta-blocker medication. The baseline QT interval adjusted for heart rate (QTc) was measured in lead II from 12-lead ECGs using the Bazett formula.\n\n#### Statistical analyses\n\nContinuous variables are presented as mean ± SD. Differences in the normally distributed variables were assessed using the t test and the paired t test for dependent variables. Mann-Whitney U test and Wilcoxon signed rank test were used as nonparametric tests when appropriate. Proportions were compared by χ 2 or Fisher exact tests as appropriate. All tests were 2-sided, and a probability value of P < .05 was considered statistically significant. SPSS version 14.0 (SPSS Inc, Chicago, IL) was used for data analysis.\n\n### Study subjects\n\nWe studied 19 CPVT patients and 19 unaffected control subjects. For this study, we reviewed Finnish families with a known RyR2 mutation. Nineteen gene-positive patients coming from 2 affected families participated in the study protocol. Thus, a 24-h ECG recording was performed in each patient carrying 1 of 2 different RyR2 mutations (P2328S, n = 13, or V4653F, n = 6). Thirteen patients (68%) had either exercise-related syncope or cardiac arrest in their medical history ( Table 1 ). In the past history of the 2 families, the cumulative mortality by the age of 30 years was 31%. 2\n\nAll CPVT patients had normal findings on echocardiography, and at baseline electrolyte test, none showed electrolyte abnormalities. None of the patients were taking any medications known to affect the QT interval. The CPVT patients first performed a bicycle ergometer exercise test with continuous ECG recording. The heart rate at which ventricular bigeminy appeared was recorded. After the exercise test the 24 aves and U-waves\n\nThe CPVT patients showed T-waves (T1) of lower amplitude than the unaffected subjects ( Figure 4 ). The T2-wave to T1-wave amplitude ratio of more than 1 was observed in 17 of 19 (89%) CPVT patients, and in 14 of 19 (74%) unaffected subjects. The maximal T2-wave to T1-wave amplitude ratio was 1.9 ± 0.7 (range 1 to 3.2) among CPVT patients and 1.4 ± 0.4 (range 1 to 2) in unaffected subjects ( P = .03).\n\nSix of 19 (32%) CPVT patients and 1 of 19 (5%) unaffected subjects showed U-waves of higher amplitude than T-waves (T1 and T2) during 24-h recordings. Episodes with the U-wave higher than the T-wave typically lasted only a few seconds ( Figure 2 ). Separate U-waves with an amplitude higher than 0.1 mV were present in 18 CPVT patients (95%) and in 10 unaffected subjects (53%; P = .008). The amplitude of U-waves was highest at high heart rates in both study groups ( Figure 4 ). The maximal U-wave amplitude as well as the maximal U-wave to T-wave amplitude ratio was greater in the CPVT patient group ( Table 2 ). Maximal U-wave amplitude was 0.24 ± 0.09 mV among the 9 CPVT patients showing the most ventricular premature beats, whereas the corresponding value was 0.16 ± 0.04 mV among the 10 patients with the fewest extrasystoles ( P = .02). We observed ventricular premature beats on U-waves in 5 CPVT patients at high heart rates ( Figure 5 ).\n\n#### Effects of beta-blockers on repolarization parameters\n\nBeta-blockers reduced the heart rate of each of the 12 CPVT patients taking the medication, confirming that they were indeed using the beta-blockers. Beta-blocker treatment had little effect on QT intervals measured at any heart rates, whereas at RR intervals of 700 ms or shorter (heart rates higher than 85 beats/min) the maximal TPE interval values were shorter during the treatment than before the treatment (data not shown). The treatment with beta-blockers decreased the diurnal maximal T2-wave amplitudes ( Table 3 ). The maximal T2-wave to T1-wave & editingJames E Potts: Methodology, Writing – review & editingFilip Van Petegem: Conceptualization, Formal analysis, Funding acquisition, Investigation, Methodology, Software, Supervision, Writing – review & editingShubhayan Sanatani: Conceptualization, Data curation, Funding acquisition, Investigation, Methodology, Supervision, Validation, Writing – review & editingChunhua Song: Editor\n\nReceived 2018 Jul 20; Accepted 2018 Oct 3; Collection date 2018.\n© 2018 Roston et al\n\nThis is an open access article distributed under the terms of the Creative Commons Attribution License , which permits unrestricted use, distribution, and reproduction in any medium, provided the original author and source are credited.\nPMC Copyright noticePMCID: PMC6221297  PMID: 30403697\n\n## Abstract\n\n### Background\n\nCatecholaminergic polymorphic ventricular tachycardia (CPVT) is often a life-threatening arrhythmia disorder with variable penetrance and expressivity. Little is known about the incidence or outcomes of CPVT patients with ≥2 variants.\n\n### Methods\n\nThe phenotypes, genotypes and outcomes of patients in the Pediatric and Congenital Electrophysiology Society CPVT Registry with ≥2 variants in genes linked to CPVT were ascertained. The American College of Medical Genetics & Genomics (ACMG) criteria and structural mapping were used to predict the pathogenicity of variants (3D model of pig RyR2 in open-state).\n\n### Results\n\nAmong 237 CPVT subjects, 193 (81%) had genetic testing. Fifteen patients (8%) with a median age of 9 years (IQR 5–12) had ≥2 variants. Sudden cardiac arrest occurred in 11 children (73%), although none died during a median follow-up of 4.3 years (IQR 2.5–6.1). Thirteen patients (80%) had at least two RYR2 variants, while the remaining two patients had RYR2 variants plus variants in other CPVT-linked genes. Among all variants identified, re-classification of the commercial laboratory interpretation using ACMG criteria led to the upgrade from variant of unknown significance (VUS) to pathogenic/likely pathogenic (P/LP) for 5 variants, and downgrade from P/LP to VUS for 6 variants. For RYR2 variants, 3D mapping using the RyR2 model suggested that 2 VUS by ACMG criteria were P/LP, while 2 variants were downgraded to likely benign.\n\n### Conclusions\n\nThis severely affected cohort demonstrates that a minority of CPVT cases are related to ≥2 variants, which may have implications on family-based genetic counselling. While multi-variant CPVT patients were at high-risk for sudden cardiac arrest, there are insufficient data to conclude that this genetic phenomenon has prognostic implications at present. Further research is needed to determine the significance and generalizability of this observation. This study also shows that a rigorous approach to variant re-classification using the ACMG criteria and 3D mapping is important in reaching an accurate diagnosis, especially in the multi-variant population.\n\n## Introduction\n\nCatecholaminergic polymorphic ventricular tachycardia (CPVT) is a rare inherited arrhythmia syndrome characterized by ventricular tachycardia (VT) provoked by adrenergic stress. [ 1 ] The condition is caused by excessive calcium leak from the sarcoplasmic reticulum, leading to delayed after-depolarizations and arrhythmias. [ 1 ] Most cases are attributed to mutations in RYR2- coded ryanodine receptor (RyR2) or CASQ2- coded calsequestrin-2 [ 1 ]. Although less recognized, SCN5A , TRDN , and CALM1-3 have also been implicated in catecholamine sensitive polymorphic VT. [ 2 – 7 ]\n\nTo date, genotype-based risk predictors have not been clinically useful. In other inherited arrhythmic conditions, like long QT syndrome (LQTS) and hypertrophic and arrhythmogenic cardiomyopathies, patients with double and compound mutations fare especially poorly. [ 8 – 12 ] We used the Pediatric and Congenital Electrophysiology Society (PACES) Registry [ 13 , 14 ] to characterize CPVT patients with ≥2 variants. To systematically assess the likelihood of pathogenicity, variants were mapped on to the 3D structure of RyR2, which provides mechanistic insights into their function and enhances the analysis compared to sequence-based scoring algorithms alone.\n\n## Material and methods\n\nThis is a retrospective study derived from the PACES CPVT Registry, which is an international multicenter registry of children (≤19 years) and their first-degree relatives with a diagnosis of CPVT made by consensus criteria. [ 1 ] Clinical, genotypic and outcome data were previously reported. [ 13 , 14 ] Participating sites received ethical approval locally and the protocol adhered to the 1975 Declaration of Helsinki. The coordinating center was responsible for data collection and analysis, and the protocol was approved by the UBC C&W Research Ethics Board. The review board did not require individual patient consent as the study was a retrospective chart review. All data were de-identified prior to entry and analysis. A stepwise bioinformatics approach was implemented to classify variant pathogenicity, including structural mapping using 3D model of pig RyR2 in open-state ( Fig 1 ). Continuous data are presented as the median (interquartile range). Detailed methods are available in the supporting supplemental information ( S1 File and S2 File ).\n\n*Figure: Domains are coloured according to the linear sequence scheme shown above the ribbon diagram. Structure obtained from PDB: 5GOA. [ 15 ] The ribbon diagram shows a RyR2 dimer from the side. Red circles represent large alpha solenoid regions which are unstructured in the cryo-electron micrograph (CryoEM) structure. All variants discussed in the manuscript are shown in sphere representations. Red squares highlight location of the most likely damaging variants (expanded in Fig 2 ). Domains are named according to nomenclature used by des Georges, et al., 2016. A ( dark orange ), B ( green ), and C ( light blue ) domains: form part of the N-terminal domain (NTD); NSol ( dark blue ): alpha-solenoid region near the NTD; SPRY1 ( light orange ), SPRY2 ( dark green ), and SPRY3 ( dark grey ): three domains named after sp lA kinase and Ry Rs where they were first identified; Sol2 ( light grey ): second alpha-solenoid region centrally located on RyR2; Rep12 ( yellow ) and Rep23 ( brown ): four repeats (~100 aa each) in two tandem arrangements, Repeats 1 and 2 located between SPRY 1 and SPRY2, and Repeats 3 and 4 located within Sol2; CSol3 ( magenta ): third alpha-solenoid region located near the C-terminal; EFs ( red ): pair of EF hand-like motifs located within CSol3 region; TaF ( light green ): thumb and forefingers domain; DR1/2/3 ( white ): evolutionary divergent regions of RyR isoforms (not shown in the ribbon diagrams); pVSD ( gold ): pseudo voltage-sensing domain; PFD ( wheat ): pore-forming domain; CTD ( pink ): C-terminal domain.*\n\n## Results\n\n### Population\n\nOf 237 patients entered in the PACES CPVT Registry, 193 (81%) underwent genetic testing. There were 15 patients (8%) from 12 families with ≥2 variants. Table 1 summarizes the genotypes and phenotypes of these multi-variant carriers. The median age at presentation was 9 years (IQR 5–12) and 9 (60%) were female. Thirteen children (87%) had ≥2 RYR2 variants, one had CASQ2 and RYR2 variants, and one had RYR2 and SCN5A variants ( Table 1 , Table 2 and S2 File ). There were 12 children (80%) who were probands. Inheritance could not be established in 6 children (40%) owing to a lack of parental genetic data. A family history of suspected/confirmed CPVT was reported in 10 patients (67%). VT and/or sudden cardiac arrest (SCA) occurred in 13 of 15 cases (87%). The exceptions were subject #6 who was asymptomatic and subject #12 who had exertional syncope and seizures. Pedigrees for patients from select families are available in the supporting information ( S3 File ).\n\n#### Table 1. Clinical characteristics and outcomes of multi-variant carriers.\n\n| Subject | Sex | Et galli, MD; Hervé Le Marec, MD, PhD;\n Hanno L. Tan, MD, PhD; Jean-Jacques Schott, PhD\n\nBackground—Mutations in SCN5A are identified in '20% to 30% of probands affected by Brugada syndrome (BrS).\n  However, in familial studies, the relationship between SCN5A mutations and BrS remains poorly understood. The aim\n  of this study was to investigate the association of SCN5A mutations and BrS in a group of large genotyped families.\nMethods and Results—Families were included if at least 5 family members were carriers of the SCN5A mutation, which was\n  identified in the proband. Thirteen large families composed of 115 mutation carriers were studied. The signature type I ECG\n  was present in 54 mutation carriers (BrS-ECG1; 47%). In 5 families, we found 8 individuals affected by BrS but with a\n  negative genotype (mutation-negative BrS-ECG1). Among these 8 mutation-negative BrS-ECG1 individuals, 3, belonging\n  to 3 different families, had a spontaneous type I ECG, whereas 5 had a type I ECG only after the administration of sodium\n  channel blockers. One of these 8 individuals had also experienced syncope. Mutation carriers had, on average, longer PR and\n  QRS intervals than noncarriers, demonstrating that these mutations exerted functional effects.\nConclusions—Our results suggest that SCN5A mutations are not directly causal to the occurrence of a BrS-ECG1 and that\n  genetic background may play a powerful role in the pathophysiology of BrS. These findings add further complexity to\n  concepts regarding the causes of BrS, and are consistent with the emerging notion that the pathophysiology of BrS\n  includes various elements beyond mutant sodium channels. (Circ Cardiovasc Genet. 2009;2:552-557.)\n Key Words: death, sudden (if surviving, use heart arrest) n Brugada syndrome n SCN5A n genetics\n n tachyarrhythmias n arrhythmia\n\n\nB rugada syndrome (BrS) is an inherited arrhythmia syn-\n drome with an increased risk of sudden death, resulting\nfrom polymorphic ventr
