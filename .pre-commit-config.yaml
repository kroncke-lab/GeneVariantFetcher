repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        # Locked benchmark artifacts must stay byte-identical to their
        # LOCK.json digests; predictions.json is also chmod read-only.
        # The mixed-gold inventory/manifests are SHA-256-pinned by
        # registry.json (an empty trailing column is a trailing tab).
        # Preserve the audited diff and exact as-sent CLI review inputs too.
        exclude: |
          (?x)^(
            benchmarks/(codex_paper_eval/runs|evaluation_tiers/mixed_gold(?:_continuation_120)?)/
            |docs/evidence/model_routing_20260906/(runtime_telemetry_amendment\.diff|reviews/(failed_usage_contract|runtime_compatibility|non_dispatch)_prompt\.txt)$
          )
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
            benchmarks/(codex_paper_eval/runs|evaluation_tiers/mixed_gold(?:_continuation_120)?)/
            |docs/evidence/model_routing_20260906/(runtime_telemetry_amendment\.diff|reviews/(failed_usage_contract|runtime_compatibility|non_dispatch)_prompt\.txt)$
          )
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1200"]
        # Preserve complete SHA-locked tranche records and the three full BRCA2
        # evidence tables needed to reproduce the dated grant analysis/audit.
        exclude: |
          (?x)^(
            benchmarks/codex_paper_eval/runs/(20260905_protocol_cont120_03_(baseline|candidate)|20260906_model12_grok43_astra_clinical_verified)/predictions\.json
            |docs/evidence/grant_e2e_20260909/analysis/BRCA2/posterior_variants\.csv
            |docs/evidence/grant_e2e_20260909/analysis/BRCA2_protocol/(posterior_variants|oof_predictions)\.csv
          )$
      - id: check-merge-conflict
