repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        # Locked benchmark artifacts must stay byte-identical to their
        # LOCK.json digests; predictions.json is also chmod read-only.
        # The mixed-gold inventory/manifests are SHA-256-pinned by
        # registry.json (an empty trailing column is a trailing tab).
        exclude: ^benchmarks/(codex_paper_eval/runs|evaluation_tiers/mixed_gold(?:_continuation_120)?)/
      - id: end-of-file-fixer
        exclude: ^benchmarks/(codex_paper_eval/runs|evaluation_tiers/mixed_gold(?:_continuation_120)?)/
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1200"]
      - id: check-merge-conflict
