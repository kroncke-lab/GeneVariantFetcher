name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Keep CI aligned with .pre-commit-config.yaml. Unpinned Ruff releases
          # may enable new rule families and fail on unrelated existing code.
          pip install ruff==0.15.20
      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: sudo apt-get install -y poppler-utils
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov
      - name: Run tests
        run: |
          pytest tests/unit -v
        env:
          # Not example.com: Settings rejects any address containing
          # "example.com" as an unconfigured placeholder (config/settings.py).
          NCBI_EMAIL: "ci@ncbi.test"
          OPENAI_API_KEY: "sk-test-dummy"

  integration-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Run offline integration tests
        run: |
          pytest -v \
            tests/test_manifest.py \
            tests/test_failure_logger.py \
            tests/test_extract_cli.py \
            tests/test_pmid_input.py \
            tests/recall/test_bounded_e2e.py

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build and install the wheel in isolation
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m venv /tmp/gvf-wheel-smoke
          /tmp/gvf-wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/gvf-wheel-smoke/bin/python - <<'PY'
          import importlib.util
          from cli.institutional_preflight import probe_institutional_access
          from harvesting.paywall_session import make_session
          from pipeline.reference_validation import load_reference_protein
          from utils.variant_normalizer import _load_gene_aliases

          assert importlib.util.find_spec("scripts") is None
          assert callable(probe_institutional_access)
          assert callable(make_session)
          assert len(_load_gene_aliases("KCNH2")) > 4_000
          assert len(load_reference_protein("KCNH2")) == 1_159
          PY

  benchmark-guards:
    # Gates the precision/negative benchmark cases (self-contained: no network,
    # no LLM, no DB) and smoke-checks the curated benchmark runner. The curated
    # SCORE gate (run_benchmark.py --fail-on-regression) needs the gitignored
    # canonical DBs, so it runs in the nightly, not here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Negative benchmark cases (precision guards)
        run: pytest -v benchmarks/curated_extraction_eval/negative_cases
      - name: Curated benchmark runner smoke
        run: python benchmarks/curated_extraction_eval/run_benchmark.py --help
      - name: Cold-start harness smoke (dry-run)
        run: python benchmarks/cold_start_eval/run_cold_start.py LDLR
        env:
          NCBI_EMAIL: "ci@ncbi.test"
